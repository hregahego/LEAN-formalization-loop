name: ci

# Every branch, not just main: this repo is developed on feature branches, and a
# trigger of `branches: [main]` meant CI never ran until a pull request existed —
# which is exactly when it is least useful. workflow_dispatch allows a manual run.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run when new commits land on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The harness is bash + BSD/GNU userland sensitive, so exercise both. Several
    # past bugs were platform-specific (BSD `mktemp` template handling, bash 3.2
    # empty-array semantics under `set -u`).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Harness compiles
        run: python -m compileall -q reference/scripts/verify.py
      - name: Scripts compile
        run: python -m compileall -q formlib.py signals.py setup.py init.py loop.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
